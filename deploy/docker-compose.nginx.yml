services:
  nginx:
    image: nginx:1.30.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/compose-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/uploads:/usr/share/nginx/html/upload:ro
      - ./runtime/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
